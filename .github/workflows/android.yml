name: Build Android app (AAB + APK)

# Run manually from the Actions tab. Produces:
#   - a release .aab for Google Play (signed when signing secrets are set)
#   - a debug .apk you can sideload straight onto a phone for a quick test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (Capacitor target)
        run: npm run build:app

      - name: Sync to Android project
        run: npx cap sync android

      - name: Decode signing keystore (if configured)
        id: ks
        env:
          KS_B64: ${{ secrets.CHEWIE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/chewie-upload.jks"
            echo "path=$RUNNER_TEMP/chewie-upload.jks" >> "$GITHUB_OUTPUT"
            echo "Signing keystore decoded — the AAB will be signed."
          else
            echo "No CHEWIE_KEYSTORE_BASE64 secret set — the AAB will be UNSIGNED (not yet uploadable to Play). See ANDROID.md."
          fi

      - name: Build release AAB
        working-directory: android
        env:
          CHEWIE_KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          CHEWIE_STORE_PASSWORD: ${{ secrets.CHEWIE_STORE_PASSWORD }}
          CHEWIE_KEY_ALIAS: ${{ secrets.CHEWIE_KEY_ALIAS }}
          CHEWIE_KEY_PASSWORD: ${{ secrets.CHEWIE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Build debug APK (sideloadable)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: chewie-android
          if-no-files-found: warn
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
