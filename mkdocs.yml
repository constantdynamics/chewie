site_name: Chewie — Design Docs
site_description: Architecture & product design for Chewie, a calm mindful-eating companion.
site_url: https://constantdynamics.github.io/chewie/
repo_url: https://github.com/constantdynamics/chewie
repo_name: constantdynamics/chewie
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  icon:
    logo: material/silverware-fork-knife
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: README.md
  - 01 · Product Vision: 01-product-vision.md
  - 02 · System Architecture: 02-system-architecture.md
  - 03 · Chewing Engine & ChewArt: 03-chewing-engine-and-art.md
  - 04 · Sensing & Meal AI: 04-sensing-and-ai.md
  - 05 · Scoring Model: 05-scoring-model.md
  - 06 · Companion & Pairing: 06-companion-and-pairing.md
  - 07 · Data, Privacy & GDPR: 07-data-model-and-privacy.md
  - 08 · Responsible Design & Safety: 08-responsible-design-and-safety.md
  - 09 · Roadmap & MVP: 09-roadmap-and-mvp.md
  - 10 · Nourishment Mode: 10-nourishment-and-intake-targets.md
  - Architecture Decisions: adr/README.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
